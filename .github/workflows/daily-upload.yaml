name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 12 * * *'  # Every day at 12:00 UTC
  workflow_dispatch:       # Manual trigger from Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p output tokens logs

      - name: Write YouTube credentials
        run: |
          echo '${{ secrets.YOUTUBE_CREDENTIALS }}' > tokens/youtube_credentials.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' > tokens/youtube_token.json

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: python main.py

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/final_*.mp4
          retention-days: 7

      - name: Upload metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-metadata-${{ github.run_number }}
          path: output/metadata_*.json
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
